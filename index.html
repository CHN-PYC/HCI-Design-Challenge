<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script>
      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(
          eventName,
          (event) => event.preventDefault(),
          { passive: false },
        );
      });
    </script>
    <meta name="theme-color" content="#FFF7EC" />
    <meta
      name="description"
      content="NutriPal healthy-eating prototype for personalised meal planning and proactive support."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NutriPal" />
    <link rel="icon" href="%BASE_URL%icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>NutriPal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
